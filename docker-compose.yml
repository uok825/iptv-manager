services:
  iptv-manager:
    build: .
    container_name: iptv-manager
    ports:
      - "${PORT:-7345}:7345"
    volumes:
      - iptv-data:/app/data
    environment:
      - PUBLIC_URL=${PUBLIC_URL:-}
      - EPG_URL=${EPG_URL:-https://epgshare01.online/epgshare01/epg_ripper_TR1.xml.gz}
      - SYNC_INTERVAL_DAYS=${SYNC_INTERVAL_DAYS:-7}
    restart: unless-stopped

volumes:
  iptv-data:

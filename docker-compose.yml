services:
  iptv-manager:
    build: .
    container_name: iptv-manager
    ports:
      - "${PORT:-7345}:7345"
    volumes:
      - iptv-data:/app/data
    environment:
      - PUBLIC_URL=${PUBLIC_URL:-}
      - SYNC_INTERVAL_DAYS=${SYNC_INTERVAL_DAYS:-7}
    restart: unless-stopped

volumes:
  iptv-data:
